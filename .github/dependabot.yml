# Dependency-Updates aktuell halten (nativ in GitHub, kein App-Setup nötig).
# Wöchentliche PRs, gruppiert, damit es nicht zerfasert.
version: 2
updates:
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Nur Versionen vorschlagen, die schon ein paar Tage alt sind — vermeidet
    # frisch veröffentlichte, evtl. noch fehlerhafte Releases (analog zum
    # cooldown in glabs.gui, wo pnpm ohnehin ein 24h-Gate erzwingt).
    cooldown:
      default-days: 3
    groups:
      # alles an Minor/Patch gebündelt; Majors kommen einzeln, da sie brechen können
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfile-Base-Images (golang:1.26-alpine, alpine:3.21 -- beide gepinnt).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Gepinnte Fremd-Images in deploy/docker-compose.yml (caddy, mongo, oauth2-proxy, gui).
  - package-ecosystem: docker-compose
    directory: '/deploy'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
