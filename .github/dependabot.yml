# Dependency-Updates aktuell halten (nativ in GitHub, kein App-Setup nötig).
# Wöchentliche PRs, gruppiert, damit es nicht zerfasert.
version: 2
updates:
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Nur Versionen vorschlagen, die schon ein paar Tage alt sind — vermeidet
    # frisch veröffentlichte, evtl. noch fehlerhafte Releases (analog zum
    # cooldown in glabs.gui, wo pnpm ohnehin ein 24h-Gate erzwingt).
    cooldown:
      default-days: 3
    groups:
      # alles an Minor/Patch gebündelt; Majors kommen einzeln, da sie brechen können
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfile-Base-Images (golang und alpine, beide auf einen Minor gepinnt).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Die gepinnten Fremd-Images aus deploy/docker-compose.yml werden hier NICHT mehr
  # beobachtet. Das Deployment liegt seit dem Split im privaten obcode/glabs.dev, und dort
  # deckt die dependabot.yml dieselben Images ab. Ein zweiter Eintrag hier hätte eine Datei
  # gebumpt, die nichts mehr ausrollt — die PRs sähen aber so aus, als kämen sie in
  # Produktion an. deploy/ selbst bleibt vorerst liegen: der alte, abgeschaltete deploy-Job
  # checkt es beim Rollback aus einem Release-Tag aus.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
