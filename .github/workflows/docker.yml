name: Create and publish the glabs-web Docker image

on:
  # Triggered explicitly from ci.yml after a release (go-semantic-release creates
  # the release with GITHUB_TOKEN, which does not fire the `release` event). The
  # `release` trigger is kept for a manually published release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v3.22.0)"
        required: true
        type: string
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # The CLI repo is obcode/glabs; the web server image is published as glabs-web.
  IMAGE_NAME: ${{ github.repository }}-web

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The release tag to build, from whichever trigger fired.
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the released code, not whatever is on main now.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag the image with the release tag and latest (works for both triggers).
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      # commit + build timestamp for the Dockerfile ldflags. .git is excluded via
      # .dockerignore, so main.go's VCS fallback can't fill these — without them
      # DATE stays "unknown" and the GUI footer shows no build time.
      - name: Compute build metadata
        id: build_meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version metadata into the build (main.go ldflags via the Dockerfile).
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
            DATE=${{ steps.build_meta.outputs.date }}

  # Trigger the deploy, which lives in the PRIVATE obcode/glabs.dev together with the compose
  # file, the Caddyfile and deploy.sh. Rather than mirroring those here, a release dispatches a
  # workflow over there. This job is an outbound API call, so it runs on a GitHub-hosted runner —
  # no self-hosted runner is needed in this public repo any more, which is the point: a workflow
  # change here can no longer reach the production host.
  dispatch-deploy:
    needs: build-and-push-image
    # Feature gate, like AUTO_DEPLOY below: without DISPATCH_TOKEN, `gh api` aborts on an empty
    # GH_TOKEN and turns the release run red although the image was pushed fine. Arm this
    # together with AUTO_DEPLOY in glabs.dev — and only after AUTO_DEPLOY here is off, or both
    # runners would roll the same release at once.
    if: ${{ vars.DEPLOY_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Dispatch the deploy in glabs.dev
        env:
          # Fine-grained PAT with nothing but "Contents: Read and write" on obcode/glabs.dev.
          # GITHUB_TOKEN cannot do this: it is scoped to THIS repository, so a
          # repository_dispatch at another repo answers 404/403.
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "DISPATCH_TOKEN is empty although the gate is on" >&2; exit 1; }
          test -n "${VERSION:-}"  || { echo "no tag resolved" >&2; exit 1; }
          gh api repos/obcode/glabs.dev/dispatches \
            -f event_type=deploy-web \
            -F "client_payload[tag]=$VERSION"
          echo "sent deploy-web $VERSION to obcode/glabs.dev"
