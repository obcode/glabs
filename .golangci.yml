# golangci-lint configuration.
#
# This file exists mainly to STATE the version. Until 2026-08-23 there was no config at all,
# and the CI installed the linter with
#
#     go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
#
# which is the v1 module path -- v2 lives under .../v2/... . `@latest` therefore resolved to
# the last v1 release forever, and this repository was quietly linted by v1.64.8 from March
# 2025 while plexams.go and tallox.go had long moved to v2. Checks added since then, including
# the SA1019 that broke plexams' pipeline that same day, simply never ran here.
#
version: "2"

run:
  timeout: 5m

linters:
  # The v2 standard set plus the ones tallox.go runs, with ONE deliberate omission: revive.
  #
  # tallox enables revive solely for its `exported` rule, which asks for a doc comment on every
  # exported identifier. Here that is 50 findings, and fifty comments written to satisfy a
  # linter would say fifty times what the name already says. The comments in this repository
  # explain WHY things are the way they are; adding a layer of "// WithUser sets the user"
  # underneath would make them harder to find, not easier. Worth doing as its own piece of
  # work, by someone who knows what each of those fifty things is for.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - wastedassign

  exclusions:
    generated: lax
    rules:
      # Generated code is not ours to lint.
      - path: (web/graph/generated/|models_gen\.go)$
        linters: [gocritic, unconvert, misspell, errorlint]
      # Tests may ignore returns and shadow more freely; the surrounding lines already do.
      - path: _test\.go$
        linters: [errcheck, gocritic]
